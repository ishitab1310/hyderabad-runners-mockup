<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log Activity — Hyderabad Runners</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="runner-badge">
  <svg viewBox="0 0 64 64">
    <circle cx="32" cy="14" r="6" fill="currentColor"/>
    <line x1="32" y1="20" x2="32" y2="38" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <line class="arm1" x1="32" y1="24" x2="20" y2="32" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <line class="arm2" x1="32" y1="24" x2="44" y2="20" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <line class="leg1" x1="32" y1="38" x2="20" y2="54" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <line class="leg2" x1="32" y1="38" x2="46" y2="50" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  </svg>
</div>

<div class="topbar">
  <div class="brand">
    <img src="logo.png" alt="Hyderabad Runners logo" class="logo">
    <div>Hyderabad Runners<small>Behaviour Insights</small></div>
  </div>
  <div class="topbar-right">
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="coach.html">Coach view</a>
      <a href="log-activity.html" class="active">Log activity</a>
    </nav>
    <button class="theme-toggle" onclick="toggleTheme()">☀ / ☾</button>
  </div>
</div>

<main>
  <h1>Log activity</h1>
  <p class="subtitle">Add or import runner participation data.</p>

  <div class="panel">
    <h2>Add a single entry</h2>
    <form class="form-grid" onsubmit="return false;">
      <label>Runner
        <input type="text" placeholder="e.g. Ron Weasley">
      </label>
      <label>Run / event
        <input type="text" placeholder="e.g. Sunrise 5K">
      </label>
      <label>Date
        <input type="date">
      </label>
      <label>Status
        <select>
          <option>Attended</option>
          <option>Missed</option>
        </select>
      </label>
    </form>
    <div class="actions" style="margin-top: 16px;">
      <button class="btn primary">Add entry</button>
      <button class="btn ghost">Clear</button>
    </div>
  </div>

  <div class="panel">
    <h2>Or import in bulk</h2>
    <p class="dim" style="font-size:13px; margin: 0 0 14px;">Upload an existing sign-up sheet or event export instead of entering runs one by one.</p>
    <div class="actions">
      <button class="btn">Upload attendance sheet (.csv)</button>
    </div>
  </div>
</main>

<script>
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  html.setAttribute('data-theme', isLight ? 'dark' : 'light');
  localStorage.setItem('theme', isLight ? 'dark' : 'light');
}
(function() {
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
})();
</script>
</body>
</html>
