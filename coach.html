<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runner — Hyderabad Runners</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="runner-badge">
  <svg viewBox="0 0 64 64">
    <circle cx="32" cy="14" r="6" fill="currentColor"/>
    <line x1="32" y1="20" x2="32" y2="38" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <line class="arm1" x1="32" y1="24" x2="20" y2="32" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <line class="arm2" x1="32" y1="24" x2="44" y2="20" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <line class="leg1" x1="32" y1="38" x2="20" y2="54" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    <line class="leg2" x1="32" y1="38" x2="46" y2="50" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  </svg>
</div>
<div class="topbar">
  <div class="brand">
    <img src="logo.png" alt="Hyderabad Runners logo" class="logo">
    <div>Hyderabad Runners<small>Behaviour Insights</small></div>
  </div>
  <div class="topbar-right">
    <nav>
      <a href="index.html" class="active" aria-current="page">Overview</a>
      <a href="global.html">Global view</a>
      <a href="log-activity.html">Log week</a>
    </nav>
    <button class="theme-toggle" onclick="toggleTheme()">☀ / ☾</button>
  </div>
</div>
<main>
  <a href="index.html" class="back-link">← Back to overview</a>
  <div class="runner-header"><div><h1 id="code">Loading…</h1><p class="subtitle" id="about" style="margin:4px 0 0"></p></div><div class="header-tags" id="tags"></div></div>
  <div class="panel"><h2>Weekly attendance</h2><div id="chart"></div><p class="dim small chart-note" id="cn"></p></div>
  <div class="panel"><h2>What the pattern shows</h2><p class="insight" id="ins"></p><p class="dim small" id="why"></p></div>
  <div class="panel"><h2>Suggested next step</h2><p id="next"></p><h3 class="sub">Record what you did</h3><div class="actions" id="btns"></div><ul class="history" id="hist"></ul></div>
  <div class="panel"><h2>Recent weeks</h2><ul class="timeline" id="tl"></ul></div>
</main>
<script src="js/app.js"></script>
<script>
(function(){'use strict';var $=function(i){return document.getElementById(i)},esc=UI.esc;
var id=new URLSearchParams(location.search).get('id'),r;
function draw(){document.title=r.code+' — Hyderabad Runners';$('code').textContent=r.code;$('about').textContent=r.about;
 $('tags').innerHTML=UI.tag(r.state,r.sl)+' <span class="chip">'+esc(r.pl)+'</span>';
 $('chart').innerHTML=UI.chart(r.weeks,{base:r.base,cw:r.cw,label:r.code+': sessions per week'});
 $('cn').textContent='Sessions attended out of 4 each week.'+(r.cw!=null?' The red line is the week the change was detected.':'')+(r.ign?' '+r.ign+' unusual week(s) shaded and ignored.':'');
 $('ins').innerHTML='<strong>'+esc(r.pl)+'</strong>'+(r.cw!=null?' · change detected in week '+r.cw:'')+'. '+esc(r.reason);
 $('why').textContent=r.base==null?'':'Their own usual: '+(Math.round(r.base*10)/10)+' sessions a week. Unusual weeks are left out of this.';
 $('next').textContent=r.next;
 $('btns').innerHTML=Object.keys(HR.ACT).map(function(k){return '<button type="button" class="btn'+(k=='message'?' primary':k=='not_concern'||k=='snooze'?' ghost':'')+'" data-act="'+k+'">'+esc(HR.ACT[k])+'</button>'}).join('');
 $('hist').innerHTML=r.actions.map(function(a){return '<li><span>'+esc(a.label)+' · week '+a.w+(a.outcome?' <span class="outcome">'+esc(a.outcome)+'</span>':'')+'</span><button type="button" class="linklike" data-undo="'+a.id+'">Undo</button></li>'}).join('');
 $('tl').innerHTML=r.weeks.slice(-6).reverse().map(function(z){return '<li><span>Week '+z.w+'</span>'+(z.u?'<span class="dim">Unusual week · '+esc(z.note)+', ignored</span>':z.a===0?'<span class="missed">Missed</span>':'<span class="attended">'+z.a+' of 4</span>')+'</li>'}).join('')}
function load(){try{r=HR.runner(id||HR.needsYou().needs.concat(HR.needsYou().runners)[0].id);draw()}catch(e){$('code').textContent='Runner not found'}}
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]'),u=e.target.closest('[data-undo]');
 if(b){HR.act(r.id,b.dataset.act);UI.toast('Saved: '+b.textContent+'.');load()}else if(u){HR.undo(+u.dataset.undo);UI.toast('Undone.');load()}});
load();
})();
</script>
</body>
</html>
